# Sitio interno de inventario (práctica de la Sesión 3, datos ficticios)
server {
    listen       80;
    server_name  localhost;

    # Tamaño máximo de los archivos que se suben al inventario
    client_max_body_size 10mb;

    location / {
        root   /usr/share/nginx/html;
        index  index.html;
    }

    # Verificación de salud para el monitoreo
    location = /salud {
        default_type text/plain;
        return 200 "ok\n";
    }
}
