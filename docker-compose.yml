# Servicios del laboratorio de la Sesión 3 (datos ficticios).
# Las contraseñas se leen de .env: no se escriben en este archivo.
#
#   docker compose up -d      levanta los servicios
#   docker compose ps         muestra su estado
#   docker compose stop       los detiene sin borrar los datos

services:
  web:
    image: nginx:1.30.5
    ports:
      - "8080:80"
    volumes:
      - ./servicios/web/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./servicios/web/html:/usr/share/nginx/html:ro
    restart: unless-stopped
    # Laboratorio 1, avanzado: docker compose ps muestra (healthy) o (unhealthy)
    healthcheck:
      test: ["CMD", "curl", "-fsS", "-o", "/dev/null", "http://localhost/salud"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s

  db:
    image: postgres:17.11
    ports:
      - "5433:5432"
    environment:
      POSTGRES_DB: inventario
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      LECTOR_PASSWORD: ${LECTOR_PASSWORD}
    volumes:
      - datos-db:/var/lib/postgresql/data
      # Scripts que crean y cargan la base la primera vez que arranca
      - ./servicios/db:/docker-entrypoint-initdb.d:ro
      - ./docs/inventario-servidores.csv:/datos/inventario-servidores.csv:ro
      # Lo que se exporta con \copy ... TO 'reportes/...' aparece en ./reportes
      - ./reportes:/trabajo/reportes
    working_dir: /trabajo
    restart: unless-stopped

volumes:
  datos-db:
